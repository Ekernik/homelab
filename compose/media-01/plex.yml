services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - VERSION=docker
    volumes:
      - /mnt/configs/plex:/config
      - /mnt/tv:/tv
      - /mnt/movies:/movies
    restart: unless-stopped
